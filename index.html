<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 태양계 시뮬레이션 | 3D Solar System Explorer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
</head>
<body>
  <!-- 3D 렌더러 캔버스 컨테이너 -->
  <div id="canvas-container"></div>

  <!-- 행성 이름 2D 오버레이 라벨 레이어 -->
  <div id="labels-container"></div>

  <!-- 상단 컨트롤 & 헤더 UI -->
  <header class="top-bar ui-overlay">
    <div class="brand-badge interactive">
      <div class="brand-title">
        <span>🪐</span> 3D 태양계 탐사선
      </div>
      <div class="brand-subtitle">SOLAR SYSTEM 3D SIMULATOR</div>
    </div>

    <div class="controls-card interactive">
      <div class="controls-row">
        <button id="btn-pause" class="btn-icon" title="단축키: Space">
          <span>⏸</span> 일시정지
        </button>
        <button id="btn-reset" class="btn-icon">
          <span>🔄</span> 전체 보기
        </button>
      </div>

      <div class="controls-row">
        <button id="btn-toggle-orbits" class="btn-icon active" style="flex: 1;">
          <span>🌐</span> 궤도선 ON
        </button>
        <button id="btn-toggle-labels" class="btn-icon active" style="flex: 1;">
          <span>🏷️</span> 라벨 ON
        </button>
      </div>

      <div class="speed-control-box">
        <div class="speed-header">
          <span>시뮬레이션 속도</span>
          <span id="speed-val">1.0x</span>
        </div>
        <input type="range" id="speed-slider" class="speed-slider" min="0.1" max="15" step="0.1" value="1.0">
        <div class="speed-presets">
          <button class="speed-btn" data-speed="0.25">0.25x</button>
          <button class="speed-btn" data-speed="0.5">0.5x</button>
          <button class="speed-btn active" data-speed="1.0">1.0x</button>
          <button class="speed-btn" data-speed="3.0">3.0x</button>
          <button class="speed-btn" data-speed="6.0">6.0x</button>
          <button class="speed-btn" data-speed="12.0">12x</button>
        </div>
      </div>
    </div>
  </header>

  <!-- 행성 상세 정보 패널 (슬라이드 오버레이) -->
  <aside id="info-panel" class="info-panel hidden">
    <div class="panel-header">
      <div class="panel-title-group">
        <h2 id="panel-name-ko">지구</h2>
        <div id="panel-name-en" class="en-name">Earth</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span id="panel-type" class="panel-type-badge">지구형 암석 행성</span>
        <button id="btn-close-panel" class="btn-close" title="닫기 (ESC)">✕</button>
      </div>
    </div>

    <div class="panel-body">
      <div id="panel-metrics" class="metrics-grid">
        <!-- JS로 동적 생성 -->
      </div>

      <div class="panel-facts">
        <div style="font-weight: 600; color: #38bdf8; margin-bottom: 4px; font-size: 11px;">천체 특징 및 과학 상식</div>
        <p id="panel-facts-text"></p>
      </div>

      <div class="panel-actions">
        <button id="btn-panel-focus" class="btn-icon btn-primary">
          <span>🔍</span> 초점 고정
        </button>
        <button id="btn-panel-overview" class="btn-icon">
          <span>🌌</span> 전체 조망
        </button>
      </div>
    </div>
  </aside>

  <!-- 하단 행성 퀵 네비게이터 -->
  <nav id="bottom-nav" class="bottom-nav ui-overlay interactive">
    <!-- JS로 행성 버튼 동적 주입 -->
  </nav>

  <!-- 조작 가이드 안내 뱃지 -->
  <div class="hint-badge ui-overlay">
    <span>💡 <kbd>드래그</kbd> 시점 회전 · <kbd>우클릭/Shift</kbd> 이동 · <kbd>휠</kbd> 줌 · <kbd>행성 클릭</kbd> 초점 이동 · <kbd>Space</kbd> 일시정지</span>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
